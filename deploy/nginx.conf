server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    # connect-src/img-src permit https: so the tracking console can reach the
    # deployment-configured geo-service API and tile endpoints (render-gated:
    # point them at sovereign internal origins and nothing leaves the enclave).
    # worker-src blob: covers the bundled maplibre/cesium web workers;
    # frame-src 'self' allows the optional same-origin GeoLibre pilot iframe.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; connect-src 'self' https:; img-src 'self' data: blob: https:; script-src 'self'; style-src 'self'; worker-src 'self' blob:; frame-src 'self'; upgrade-insecure-requests" always;

    location = /healthz {
        default_type application/json;
        expires -1;
        return 200 '{"status":"ok"}';
    }

    location = /platform-config.json {
        try_files $uri =404;
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    # Self-hosted Cesium runtime assets (workers, widgets, third-party) copied
    # from the Apache-2.0 cesium npm package at build time; never proxied out.
    location /cesium/ {
        try_files $uri =404;
        expires max;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
